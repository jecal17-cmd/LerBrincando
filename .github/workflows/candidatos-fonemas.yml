# Gera várias versões do som de cada consoante contínua (pasta candidatos/) para escolha por escuta.
# Aba Actions → "Candidatos de fonemas" → Run workflow (no ramo desejado). Precisa dos Secrets do Azure.
name: Candidatos de fonemas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidatos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python -m pip install -q numpy scipy soundfile librosa pyloudnorm
      - name: Gera os candidatos
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python ferramentas/candidatos_fonemas.py
      - name: Publica no mesmo ramo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add candidatos
          git commit -q -m "Candidatos de fonemas para escuta" && git push -q origin HEAD:${{ github.ref_name }} || echo "Nada mudou."
